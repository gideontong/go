<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Globe Base Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#globe-grad)" />
  
  <!-- Globe Latitude / Longitude lines -->
  <circle cx="32" cy="32" r="28" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  <ellipse cx="32" cy="32" rx="14" ry="28" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="10" y1="18" x2="54" y2="18" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />
  <line x1="10" y1="46" x2="54" y2="46" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Map Pin Badge -->
  <g filter="url(#shadow)">
    <path d="M32 12 C24.268 12 18 18.268 18 26 C18 35.5 32 48 32 48 C32 48 46 35.5 46 26 C46 18.268 39.732 12 32 12 Z" fill="url(#pin-grad)" />
    <circle cx="32" cy="25" r="5" fill="#ffffff" />
  </g>
</svg>
